# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        enabled: true
        # Set to false for development with ngrok (HTTPS -> HTTP)
        cookie_secure: false
        cookie_samesite: lax
        cookie_httponly: true
        # Ensure session is available across different domains (ngrok)
        name: PHPSESSID
        cookie_path: /
        # Start session early to ensure CSRF tokens work
        cookie_lifetime: 0


    #esi: true
    #fragments: true



when@prod:
    framework:
        # Forge / nginx: generate https:// redirect URIs for Google OAuth
        trusted_proxies: '127.0.0.1,REMOTE_ADDR'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
        session:
            # HTTPS on Forge (.on-forge.com)
            cookie_secure: auto
            cookie_samesite: lax
            save_path: '%kernel.project_dir%/var/sessions'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
